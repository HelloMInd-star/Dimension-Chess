<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♟️ 星穹弈 · 维度战棋</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ===== 大厅 ===== -->
        <div id="lobby" class="lobby">
            <div class="lobby-header">
                <h1>♟️ 星穹弈 · 维度战棋</h1>
                <div class="theme-toggle" id="lobbyThemeToggle" title="切换深色/浅色模式">🌓</div>
            </div>
            <p class="sub">选择你的初始筹码 · 守护星 · 灵魂分路</p>

            <div class="buyin-group">
                <button class="buyin-btn" data-chips="5">🐣 5万</button>
                <button class="buyin-btn" data-chips="20">⚖️ 20万</button>
                <button class="buyin-btn" data-chips="500">🔥 500万</button>
                <button class="buyin-btn" data-chips="1000">👑 1000万</button>
                <input type="number" class="custom-input" id="customChips" placeholder="自定义 (万)" min="1" max="10000" step="1">
            </div>

            <div class="options-row">
                <div class="option-group">
                    <p>🌌 守护星</p>
                    <div class="zodiac-grid">
                        <span class="zodiac-opt" data-zodiac="aries" title="♈ 白羊座 · 烈焰冲锋">♈</span>
                        <span class="zodiac-opt" data-zodiac="taurus" title="♉ 金牛座 · 磐石之盾">♉</span>
                        <span class="zodiac-opt" data-zodiac="gemini" title="♊ 双子座 · 双重思维">♊</span>
                        <span class="zodiac-opt" data-zodiac="cancer" title="♋ 巨蟹座 · 潮汐回撤">♋</span>
                        <span class="zodiac-opt" data-zodiac="leo" title="♌ 狮子座 · 王者威光">♌</span>
                        <span class="zodiac-opt" data-zodiac="virgo" title="♍ 处女座 · 精密计算">♍</span>
                        <span class="zodiac-opt" data-zodiac="libra" title="♎ 天秤座 · 均衡之道">♎</span>
                        <span class="zodiac-opt" data-zodiac="scorpio" title="♏ 天蝎座 · 暗影突袭">♏</span>
                        <span class="zodiac-opt" data-zodiac="sagittarius" title="♐ 射手座 · 幸运之星">♐</span>
                        <span class="zodiac-opt" data-zodiac="capricorn" title="♑ 摩羯座 · 纪律之墙">♑</span>
                        <span class="zodiac-opt" data-zodiac="aquarius" title="♒ 水瓶座 · 维度穿越">♒</span>
                        <span class="zodiac-opt" data-zodiac="pisces" title="♓ 双鱼座 · 梦境迷踪">♓</span>
                    </div>
                </div>
                <div class="option-group">
                    <p>🌀 灵魂分路</p>
                    <div class="soul-grid">
                        <span class="soul-opt" data-soul="guardian">🛡️ 守护者</span>
                        <span class="soul-opt" data-soul="pathfinder">🌪️ 探路者</span>
                        <span class="soul-opt" data-soul="strategist">⚖️ 战略家</span>
                        <span class="soul-opt" data-soul="catalyst">🔥 催化者</span>
                    </div>
                </div>
            </div>

            <button class="start-btn" id="startGame">⚔️ 开始对决</button>
            <a href="tutorial.html" class="tutorial-link">🎓 新手教学</a>
            <p class="footnote">规则文档已定 · 所有机制完整实现</p>
        </div>

        <!-- ===== 牌桌 ===== -->
        <div id="table" class="hidden">
            <!-- 顶部栏 -->
            <div class="top-bar">
                <div class="theme-toggle" id="tableThemeToggle" title="切换深色/浅色模式">🌓</div>
                <div class="rhythm"><span class="icon" id="rhythmIcon">🌅</span> <span id="rhythmLabel">晨间巅峰</span> <span class="mod" id="rhythmMod">(+0.5)</span></div>
                <div class="pot">💰 底池 <span id="potAmount">0</span> 万</div>
                <div class="music-area">
                    <span id="musicLabel">🎵 冷静思考</span>
                    <button id="musicSwitch">切换 (2万)</button>
                    <button class="boom" id="boomBtn">🔥 炸裂!</button>
                </div>
            </div>

            <!-- 主网格 -->
            <div class="main-grid">
                <!-- 对手 -->
                <div class="opponent-area">
                    <div class="label">🤖 对手 · <span id="opponentName">AI</span></div>
                    <div class="chips" id="opponentChips">0 万</div>
                    <div class="hand" id="opponentHand">
                        <div class="card-back">🃏</div>
                        <div class="card-back">🃏</div>
                        <div class="card-back">🃏</div>
                    </div>
                    <div class="meta">
                        庄家: <span id="opponentDealer">❌</span> · 一心: <span id="opponentHeart">❤️0</span>
                    </div>
                </div>

                <!-- 棋盘 -->
                <div class="board-wrapper">
                    <div class="board" id="board"></div>
                    <div class="board-stats">
                        <span>回合 <span id="turnCount">0</span></span>
                        <span>小局 <span id="roundCount">0</span>/3</span>
                        <span>大局 <span id="macroCount">0</span></span>
                    </div>
                </div>

                <!-- 玩家 -->
                <div class="player-area">
                    <div class="label">👤 你 · <span id="playerName">玩家</span></div>
                    <div class="chips" id="playerChips">0 万</div>
                    <!-- 筹码抽屉 -->
                    <div class="chip-drawer" id="chipDrawer">
                        <div class="chip-drawer-handle" id="chipHandle">
                            <span>💰</span> <span id="chipTotal">0</span> 万
                            <span class="view-badge" id="viewBadge">🔍 可查看</span>
                        </div>
                        <div class="chip-drawer-content" id="chipContent">
                            <div class="chip-stack-3d" id="chipStack3d"></div>
                        </div>
                    </div>
                    <div class="hand" id="playerHand"></div>
                    <div class="meta">
                        庄家: <span id="playerDealer">❌</span> · 一心: <span id="playerHeart">❤️0</span>
                    </div>
                    <div class="meta">
                        分路: <span id="playerSoul">—</span> · 守护星: <span id="playerZodiac">—</span>
                    </div>
                </div>
            </div>

            <!-- 操作栏 -->
            <div class="action-bar" id="actionBar">
                <button id="btnSelectCard">选牌</button>
                <input type="number" class="bet-input" id="betAmount" value="1" min="1" step="1">
                <span class="unit">万</span>
                <button id="btnBet">下注走棋</button>
                <button id="btnRetreat1">←退1步 (3万)</button>
                <button id="btnRetreatHalf">退一半 (8万)</button>
                <button id="btnRetreatFull">全额撤回 (NF牌)</button>
                <button id="btnEndTurn">结束回合</button>
                <button id="btnPass">弃牌过 (+1万)</button>
                <button id="btnSkill" class="skill-btn">✦ 技能 (3万)</button>
            </div>

            <!-- 日志 -->
            <div class="log-area" id="logArea">
                <div>🎮 游戏开始，祝你好运！</div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
